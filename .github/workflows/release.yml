name: release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install babashka
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/v1.13.229/install -o install
          sudo bash install --version 1.13.229

      - name: Test
        run: bb test

      - name: Build
        run: bb build
        env:
          KNOPE_VERSION: ${{ inputs.version }}

      - name: Check version
        run: |
          actual=$(bb target/knope.jar --version)
          if [ "$actual" != "knope $VERSION" ]; then
            echo "::error::Expected 'knope $VERSION' but the jar printed '$actual'."
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Publish release
        run: gh release create "v$VERSION" target/knope.jar --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
